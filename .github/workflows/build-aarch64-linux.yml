name: Build aarch64 Linux Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 2.2.20 — no v prefix)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout tag v${{ inputs.version }}
        uses: actions/checkout@v6
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libudev-dev \
            libclang-dev \
            protobuf-compiler \
            libhidapi-dev

      - name: Install Rust toolchain
        run: |
          source ci/rust-version.sh stable
          rustup install "$rust_stable"
          rustup default "$rust_stable"

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: aarch64-linux-cargo-${{ inputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            aarch64-linux-cargo-${{ inputs.version }}-
            aarch64-linux-cargo-

      - name: Build binaries
        run: |
          source ci/rust-version.sh stable
          scripts/cargo-install-all.sh stable solana-release

      - name: Create release tarball
        run: |
          TARGET=aarch64-unknown-linux-gnu
          CHANNEL_OR_TAG="v${{ inputs.version }}"
          COMMIT="$(git rev-parse HEAD)"

          {
            echo "channel: ${CHANNEL_OR_TAG}"
            echo "commit: ${COMMIT}"
            echo "target: ${TARGET}"
          } > solana-release/version.yml

          cp solana-release/bin/agave-install-init "agave-install-init-${TARGET}"
          cp solana-release/version.yml "solana-release-${TARGET}.yml"

          tar cvf "solana-release-${TARGET}.tar" solana-release
          bzip2 "solana-release-${TARGET}.tar"

      - name: Verify tarball contents
        run: |
          echo "--- Tarball info ---"
          ls -lh solana-release-aarch64-unknown-linux-gnu.tar.bz2

          echo "--- version.yml ---"
          tar -xjf solana-release-aarch64-unknown-linux-gnu.tar.bz2 \
            solana-release/version.yml -O

          echo ""
          echo "--- Binaries ---"
          tar -tjf solana-release-aarch64-unknown-linux-gnu.tar.bz2 | \
            grep '/bin/' | sort

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ inputs.version }}"

          # Create the release if it doesn't already exist
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG not found, creating it..."
            gh release create "$TAG" \
              --title "Release $TAG" \
              --notes "aarch64-unknown-linux-gnu release for $TAG" \
              --target "$(git rev-parse HEAD)"
          fi

          gh release upload "$TAG" \
            solana-release-aarch64-unknown-linux-gnu.tar.bz2 \
            solana-release-aarch64-unknown-linux-gnu.yml \
            agave-install-init-aarch64-unknown-linux-gnu \
            --clobber
